<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern PWA Notes</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4CAF50">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: #334155;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; transition: background-color 0.2s, color 0.2s; }
    body { background-color: var(--bg-primary); color: var(--text-primary); padding: 2rem 1rem; max-width: 1000px; margin: 0 auto; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    h1 { font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .theme-btn { background: none; border: 1px solid var(--border-color); padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; color: var(--text-primary); font-weight: 600; }

    /* Sync Status Toast */
    .sync-status { font-size: 0.85rem; color: var(--text-secondary); margin-left: 0.5rem; display: inline-block; }

    /* Form Card */
    .note-form { background: var(--bg-card); padding: 1.5rem; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--border-color); margin-bottom: 2rem; }
    .input-group { margin-bottom: 1rem; }
    input[type="text"], textarea { width: 100%; border: 1px solid var(--border-color); background: transparent; color: var(--text-primary); padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.95rem; outline: none; }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
    textarea { height: 100px; resize: vertical; }

    /* Checkbox & Tag Buttons Area */
    .tool-bar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .btn-tool { background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.35rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .btn-tool:hover { border-color: var(--accent); }

    .tag-selector { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
    .tag-chip { background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-secondary); padding: 0.3rem 0.6rem; border-radius: 12px; font-size: 0.8rem; cursor: pointer; font-weight: 600; }
    .tag-chip.selected { background: var(--accent); color: white; border-color: var(--accent); }

    .form-options { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: space-between; align-items: center; margin-top: 1rem; }
    .color-picker { display: flex; gap: 0.5rem; }
    .color-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-dot.selected { border-color: var(--accent); scale: 1.1; }

    .btn-submit { background-color: var(--accent); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-submit:hover { background-color: var(--accent-hover); }

    /* Filter & Search */
    .filter-bar { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 200px; }

    /* Notes Grid */
    .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }
    
    .note-card { 
      background: var(--card-bg, var(--bg-card)); 
      color: #0f172a !important; 
      padding: 1.25rem; 
      border-radius: 14px; 
      border: 1px solid var(--border-color); 
      box-shadow: var(--shadow); 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
    }
    .note-card.pinned { border: 2px solid var(--accent); }
    
    .note-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
    .note-title { font-weight: 700; font-size: 1.1rem; word-break: break-all; color: #0f172a !important; }
    .pin-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; opacity: 0.4; }
    .pin-btn.active { opacity: 1; }

    .note-body { font-size: 0.95rem; color: #1e293b !important; line-height: 1.5; white-space: pre-wrap; margin-bottom: 1rem; }
    
    /* Checklist UI */
    .todo-item { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.25rem; }
    .todo-item.done span { text-decoration: line-through; opacity: 0.5; }

    .note-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 0.75rem; border-top: 1px solid rgba(0,0,0,0.08); }
    .tags-container { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .tag-badge { background: rgba(99, 102, 241, 0.2); color: #4338ca !important; font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 12px; font-weight: 700; }
    .delete-btn { background: none; border: none; color: #dc2626; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>✨ Modern Notes</h1>
      <span id="syncStatus" class="sync-status"></span>
    </div>
    <button class="theme-btn" id="themeToggle">🌙 다크 모드</button>
  </header>

  <!-- 메모 작성 양식 -->
  <div class="note-form">
    <div class="input-group">
      <input type="text" id="noteTitle" placeholder="제목을 입력하세요...">
    </div>

    <!-- 간편 도구: 체크박스 추가 버튼 -->
    <div class="tool-bar">
      <button type="button" class="btn-tool" id="addTodoBtn">☑️ 할 일 추가</button>
    </div>

    <div class="input-group">
      <textarea id="noteContent" placeholder="내용을 입력하세요... ('할 일 추가' 버튼을 눌러 체크박스를 넣을 수 있습니다)"></textarea>
    </div>
    
    <!-- 대표 태그 선택 버튼 -->
    <div class="input-group">
      <div class="tag-selector" id="tagSelector">
        <span style="font-size:0.85rem; color:var(--text-secondary); margin-right:0.2rem;">태그:</span>
        <span class="tag-chip" data-tag="아이디어">#아이디어</span>
        <span class="tag-chip" data-tag="장보기">#장보기</span>
        <span class="tag-chip" data-tag="할일">#할일</span>
        <span class="tag-chip" data-tag="공부">#공부</span>
        <span class="tag-chip" data-tag="중요">#중요</span>
      </div>
    </div>
    
    <div class="form-options">
      <div class="color-picker" id="colorPicker">
        <div class="color-dot selected" data-color="default" style="background: #ffffff; border: 1px solid #ccc;"></div>
        <div class="color-dot" data-color="#fef3c7" style="background: #fef3c7;"></div>
        <div class="color-dot" data-color="#dcfce7" style="background: #dcfce7;"></div>
        <div class="color-dot" data-color="#e0e7ff" style="background: #e0e7ff;"></div>
        <div class="color-dot" data-color="#fce7f3" style="background: #fce7f3;"></div>
      </div>
      <button class="btn-submit" id="addNoteBtn">메모 저장</button>
    </div>
  </div>

  <!-- 검색 및 필터 -->
  <div class="filter-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 제목, 내용, 태그로 검색...">
  </div>

  <!-- 메모 카드 리스트 -->
  <div class="notes-grid" id="notesGrid"></div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbyvoly98_umtjOkYQXHYaGocYfUVuAX4EJ5bBW5lc44S255MRuhORrEz96fZhws8I6k/exec';

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let notes = JSON.parse(localStorage.getItem('pwa_notes') || '[]');
    let selectedColor = 'default';
    let selectedTags = [];

    const notesGrid = document.getElementById('notesGrid');
    const noteTitle = document.getElementById('noteTitle');
    const noteContent = document.getElementById('noteContent');
    const addNoteBtn = document.getElementById('addNoteBtn');
    const addTodoBtn = document.getElementById('addTodoBtn');
    const searchInput = document.getElementById('searchInput');
    const themeToggle = document.getElementById('themeToggle');
    const syncStatus = document.getElementById('syncStatus');

    // 다크모드 설정
    const currentTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);
    themeToggle.textContent = currentTheme === 'dark' ? '☀️ 라이트 모드' : '🌙 다크 모드';

    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      themeToggle.textContent = newTheme === 'dark' ? '☀️ 라이트 모드' : '🌙 다크 모드';
    });

    // 체크박스([ ]) 간편 입력
    addTodoBtn.addEventListener('click', () => {
      const cursor = noteContent.selectionStart;
      const val = noteContent.value;
      const prefix = (val.length === 0 || val.endsWith('\n')) ? '' : '\n';
      
      noteContent.value = val.substring(0, cursor) + `${prefix}[ ] ` + val.substring(cursor);
      noteContent.focus();
    });

    // 태그 버튼 선택
    document.getElementById('tagSelector').addEventListener('click', (e) => {
      if (e.target.classList.contains('tag-chip')) {
        const tag = e.target.dataset.tag;
        if (selectedTags.includes(tag)) {
          selectedTags = selectedTags.filter(t => t !== tag);
          e.target.classList.remove('selected');
        } else {
          selectedTags.push(tag);
          e.target.classList.add('selected');
        }
      }
    });

    // 컬러 피커 선택
    document.getElementById('colorPicker').addEventListener('click', (e) => {
      if (e.target.classList.contains('color-dot')) {
        document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('selected'));
        e.target.classList.add('selected');
        selectedColor = e.target.dataset.color;
      }
    });

    // 🌐 구글 스프레드시트 전체 데이터 불러오기
    async function loadFromGoogleSheet() {
      if (!GAS_URL) return;

      syncStatus.textContent = '🔄 시트 메모 불러오는 중...';

      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();

        if (Array.isArray(data) && data.length > 0) {
          notes = data.map((item, idx) => {
            const rawText = item.memo || '';
            
            // 시트 포맷 파싱 ([제목], [태그], [내용])
            let title = '';
            let tags = [];
            let content = rawText;

            const titleMatch = rawText.match(/\[제목\]\s*(.*?)(?=\n|$)/);
            if (titleMatch) title = titleMatch[1].trim();

            const tagMatch = rawText.match(/\[태그\]\s*(.*?)(?=\n|$)/);
            if (tagMatch && tagMatch[1]) {
              tags = tagMatch[1].split(',').map(t => t.trim()).filter(Boolean);
            }

            const contentMatch = rawText.match(/\[내용\]\n([\s\S]*)/);
            if (contentMatch) {
              content = contentMatch[1];
            }

            return {
              id: Date.now() + idx,
              title: title,
              content: content,
              tags: tags,
              color: 'default',
              pinned: false,
              createdAt: item.time || ''
            };
          });

          saveAndRender();
          syncStatus.textContent = '✅ 동기화 완료';
        } else {
          syncStatus.textContent = '';
        }
      } catch (err) {
        console.error('GAS Load Error:', err);
        syncStatus.textContent = '⚠️ 시트 동기화 실패 (로컬 데이터 표시)';
      } finally {
        setTimeout(() => syncStatus.textContent = '', 3000);
      }
    }

    // 구글 시트로 메모 저장 (POST)
    async function syncToGoogleSheet(notePayload) {
      if (!GAS_URL) return;

      syncStatus.textContent = '☁️ 시트 저장 중...';
      
      const memoString = `[제목] ${notePayload.title || '제목 없음'}\n` +
                         `[태그] ${notePayload.tags.join(', ')}\n` +
                         `[내용]\n${notePayload.content}`;

      try {
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ memo: memoString })
        });
        syncStatus.textContent = '✅ 시트 저장 완료';
        setTimeout(() => syncStatus.textContent = '', 3000);
      } catch (err) {
        console.error('GAS Sync Error:', err);
        syncStatus.textContent = '⚠️ 시트 저장 실패 (로컬엔 저장됨)';
      }
    }

    // 메모 추가
    addNoteBtn.addEventListener('click', () => {
      const title = noteTitle.value.trim();
      const content = noteContent.value.trim();

      if (!title && !content) return alert('제목이나 내용을 입력해주세요.');

      const newNote = {
        id: Date.now(),
        title,
        content,
        tags: [...selectedTags],
        color: selectedColor,
        pinned: false,
        createdAt: new Date().toLocaleDateString()
      };

      notes.unshift(newNote);
      saveAndRender();
      
      syncToGoogleSheet(newNote);

      noteTitle.value = '';
      noteContent.value = '';
      selectedTags = [];
      document.querySelectorAll('.tag-chip').forEach(chip => chip.classList.remove('selected'));
    });

    function saveAndRender() {
      localStorage.setItem('pwa_notes', JSON.stringify(notes));
      renderNotes();
    }

    function parseContentWithCheckboxes(noteId, content) {
      const lines = content.split('\n');
      return lines.map((line, idx) => {
        if (line.startsWith('[ ] ') || line.startsWith('[x] ')) {
          const isChecked = line.startsWith('[x] ');
          const text = line.replace(/^\[[ x]\]\s*/, '');
          return `<div class="todo-item ${isChecked ? 'done' : ''}">
                    <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleTodo(${noteId}, ${idx})">
                    <span>${text}</span>
                  </div>`;
        }
        return `<div>${line}</div>`;
      }).join('');
    }

    function toggleTodo(noteId, lineIndex) {
      const note = notes.find(n => n.id === noteId);
      if (note) {
        const lines = note.content.split('\n');
        if (lines[lineIndex].startsWith('[ ] ')) {
          lines[lineIndex] = lines[lineIndex].replace('[ ] ', '[x] ');
        } else if (lines[lineIndex].startsWith('[x] ')) {
          lines[lineIndex] = lines[lineIndex].replace('[x] ', '[ ] ');
        }
        note.content = lines.join('\n');
        saveAndRender();
      }
    }

    function togglePin(id) {
      notes = notes.map(n => n.id === id ? { ...n, pinned: !n.pinned } : n);
      saveAndRender();
    }

    function deleteNote(id) {
      notes = notes.filter(n => n.id !== id);
      saveAndRender();
    }

    function renderNotes() {
      const query = searchInput.value.toLowerCase();
      const filtered = notes
        .filter(n => 
          n.title.toLowerCase().includes(query) || 
          n.content.toLowerCase().includes(query) ||
          n.tags.some(t => t.toLowerCase().includes(query))
        )
        .sort((a, b) => b.pinned - a.pinned);

      notesGrid.innerHTML = filtered.map(note => {
        const cardBg = note.color === 'default' ? '#ffffff' : note.color;
        return `
          <div class="note-card ${note.pinned ? 'pinned' : ''}" style="--card-bg: ${cardBg}">
            <div>
              <div class="note-header">
                <div class="note-title">${note.title || '제목 없음'}</div>
                <button class="pin-btn ${note.pinned ? 'active' : ''}" onclick="togglePin(${note.id})">📌</button>
              </div>
              <div class="note-body">${parseContentWithCheckboxes(note.id, note.content)}</div>
            </div>
            <div class="note-footer">
              <div class="tags-container">
                ${note.tags.map(tag => `<span class="tag-badge">${tag.startsWith('#') ? tag : '#' + tag}</span>`).join('')}
              </div>
              <button class="delete-btn" onclick="deleteNote(${note.id})">삭제</button>
            </div>
          </div>
        `;
      }).join('');
    }

    searchInput.addEventListener('input', renderNotes);

    // 초기 화면 로딩: 로컬 렌더링 후 구글 시트에서 최신 메모 불러오기
    renderNotes();
    loadFromGoogleSheet();
  </script>
</body>
</html>
